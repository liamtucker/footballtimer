<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>rota</title>
<meta name="theme-color" content="#F2F2F0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="rota">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="boot">

<!-- ------------------------------------------------------------- setup -->
<section id="setup" hidden>

  <!-- before kick-off the only ink surface is the 56px button in the corner.
       during the game that button is gone and the ink is this bar, and the
       whole of the bar is the way back to the game. -->
  <div class="livebar" id="livebar" role="button" tabindex="0" hidden>
    <span class="live-clock" id="live-clock">0:00</span>
    <span class="live-note eyebrow" id="live-note"></span>
    <button class="icon-btn mute" type="button"></button>
  </div>

  <div class="col team-col" data-team="0">
    <div class="team-head">
      <span class="team-name" id="label-0"></span>
      <span class="team-rule"></span>
    </div>
    <div class="list" id="list-0"></div>
    <div class="field">
      <input class="name-input" id="input-0" data-team="0" type="text"
             maxlength="10" autocapitalize="words" autocorrect="off" autocomplete="off"
             spellcheck="false" enterkeyhint="next" placeholder="Add a name"
             aria-label="Add a name">
      <button class="add" id="add-0" data-team="0" type="button" aria-label="Add a name">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="col team-col" data-team="1">
    <div class="team-head">
      <span class="team-name" id="label-1"></span>
      <span class="team-rule"></span>
    </div>
    <div class="list" id="list-1"></div>
    <div class="field">
      <input class="name-input" id="input-1" data-team="1" type="text"
             maxlength="10" autocapitalize="words" autocorrect="off" autocomplete="off"
             spellcheck="false" enterkeyhint="next" placeholder="Add a name"
             aria-label="Add a name">
      <button class="add" id="add-1" data-team="1" type="button" aria-label="Add a name">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="col settings-col">

    <div class="settings">
      <div class="picker" role="group" aria-label="Game">
        <span class="eyebrow picker-label">Game</span>
        <div class="picker-row">
          <button class="step" type="button" data-pick="type" data-dir="-1" aria-label="Fewer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <span class="picker-value" id="type-value">6 a side</span>
          <button class="step" type="button" data-pick="type" data-dir="1" aria-label="More">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
      </div>

      <div class="picker" role="group" aria-label="Time">
        <span class="eyebrow picker-label">Time</span>
        <div class="picker-row">
          <button class="step" type="button" data-pick="time" data-dir="-1" aria-label="Fewer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <span class="picker-value" id="time-value">2 hours</span>
          <button class="step" type="button" data-pick="time" data-dir="1" aria-label="More">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
      </div>

      <div class="picker" role="group" aria-label="Rotations">
        <span class="eyebrow picker-label">Rotations</span>
        <div class="picker-row">
          <button class="step" type="button" data-pick="rotations" data-dir="-1" aria-label="Fewer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <span class="picker-value" id="rotations-value">2 each</span>
          <button class="step" type="button" data-pick="rotations" data-dir="1" aria-label="More">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- the number the three above produce. it is not a setting and it cannot
         be set: it is their result, so it has no card and no control. -->
    <div class="readout" id="readout">
      <span class="readout-label" id="readout-label"></span>
      <span class="readout-value" id="readout-value"></span>
    </div>

    <button class="clear" id="clear" type="button" hidden></button>

    <div class="col-spacer"></div>

    <div class="foot">
      <div class="notice" id="notice" hidden></div>
      <button class="start" id="start" type="button">Kick off</button>
    </div>

  </div>

</section>

<!-- ----------------------------------------------------------- display -->
<main id="display" hidden>

  <!-- each team is one column with space between: the title, the two eyebrows
       and the two names are one group at the top, and the order strip is
       pinned to the bottom of the row. -->
  <section class="team" data-team="0">
    <div class="top">
      <span class="team-title"></span>
      <span class="eyebrow lab"></span>
      <span class="eyebrow lab-sub"></span>
      <span class="hero"><span class="layer"></span><span class="layer"></span></span>
      <span class="subname"></span>
    </div>
    <div class="bottom">
      <div class="l3 l3-goal"></div>
      <div class="l3 l3-sub"></div>
      <span class="strip"><span class="strip-track"></span></span>
    </div>
  </section>

  <section class="team" data-team="1">
    <div class="top">
      <span class="team-title"></span>
      <span class="eyebrow lab"></span>
      <span class="eyebrow lab-sub"></span>
      <span class="hero"><span class="layer"></span><span class="layer"></span></span>
      <span class="subname"></span>
    </div>
    <div class="bottom">
      <div class="l3 l3-goal"></div>
      <div class="l3 l3-sub"></div>
      <span class="strip"><span class="strip-track"></span></span>
    </div>
  </section>

  <div class="spine">
    <div class="clock" id="clock">0:00</div>
    <div class="spine-foot">
      <div class="notes eyebrow" id="notes"></div>
      <div class="spine-icons">
        <button class="icon-btn" id="home" type="button" aria-label="End the game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="2"/>
          </svg>
        </button>
        <button class="icon-btn mute" id="mute" type="button"></button>
        <button class="icon-btn" id="edit" type="button" aria-label="Edit setup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
            <path d="m15 5 4 4"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</main>

<!-- ------------------------------------------------------------- confirm -->
<!-- the only thing that stops the screen, and it is here because ending a
     game cannot be taken back -->
<div class="confirm" id="confirm" role="dialog" aria-modal="true"
     aria-labelledby="confirm-text" hidden>
  <div class="confirm-card">
    <p class="confirm-text" id="confirm-text"></p>
    <div class="confirm-row">
      <button class="start" id="confirm-yes" type="button"></button>
      <button class="start hairline" id="confirm-no" type="button"></button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
