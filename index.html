<!-- =========================================================== team select -->
<section id="setup" hidden>

  <header class="head">
    <h1 class="title dsp">TEAMS</h1>
    <button class="again" id="again" type="button">
      <span class="again-word dsp">START AGAIN</span>
      <svg class="ic ic20" aria-hidden="true"><use href="#i-restart"/></svg>
    </button>
  </header>

  <hr class="rule">

  <div class="squad" data-team="0">
    <div class="chip">
      <svg class="ic ic16" aria-hidden="true"><use href="#i-shirt"/></svg>
      <span class="chip-word eyebrow" id="chip-0">BIBS</span>
    </div>
    <div class="lineup">
      <div class="namecol">
        <p class="eyebrow lineup-label">Lineup</p>
        <div class="names" id="names-0a"></div>
      </div>
      <div class="namecol">
        <p class="eyebrow lineup-label ghost">Subs</p>
        <div class="names" id="names-0b"></div>
      </div>
    </div>
    <div class="entry">
      <input class="field dsp" id="input-0" data-team="0" type="text" maxlength="10"
             autocapitalize="words" autocorrect="off" autocomplete="off" spellcheck="false"
             enterkeyhint="done" placeholder="Enter name" aria-label="Enter a name for Bibs">
      <button class="enter" id="enter-0" data-team="0" type="button" aria-label="Add this name">
        <svg class="ic ic24" aria-hidden="true"><use href="#i-up"/></svg>
      </button>
    </div>
  </div>

  <hr class="rule">

  <div class="squad" data-team="1">
    <div class="chip">
      <svg class="ic ic16" aria-hidden="true"><use href="#i-shirt-o"/></svg>
      <span class="chip-word eyebrow" id="chip-1">NON BIBS</span>
    </div>
    <div class="lineup">
      <div class="namecol">
        <p class="eyebrow lineup-label">Lineup</p>
        <div class="names" id="names-1a"></div>
      </div>
      <div class="namecol">
        <p class="eyebrow lineup-label ghost">Subs</p>
        <div class="names" id="names-1b"></div>
      </div>
    </div>
    <div class="entry">
      <input class="field dsp" id="input-1" data-team="1" type="text" maxlength="10"
             autocapitalize="words" autocorrect="off" autocomplete="off" spellcheck="false"
             enterkeyhint="done" placeholder="Enter name" aria-label="Enter a name for Non bibs">
      <button class="enter" id="enter-1" data-team="1" type="button" aria-label="Add this name">
        <svg class="ic ic24" aria-hidden="true"><use href="#i-up"/></svg>
      </button>
    </div>
  </div>

  <div class="foot">
    <hr class="rule">
    <div class="settings">
      <button class="cell" id="cell-aside" data-cell="aside" type="button">
        <span class="eyebrow cell-label">Aside</span>
        <span class="cell-value dsp" id="value-aside">6</span>
      </button>
      <button class="cell" id="cell-time" data-cell="time" type="button">
        <span class="eyebrow cell-label">Time</span>
        <span class="cell-value dsp" id="value-time">2Hrs</span>
      </button>
      <button class="cell" id="cell-rotations" data-cell="rotations" type="button">
        <span class="eyebrow cell-label">Rotations</span>
        <span class="cell-value dsp" id="value-rotations">2</span>
      </button>
    </div>
    <button class="kick" id="kick" type="button">
      <span class="kick-main">
        <svg class="ic ic28" aria-hidden="true"><use href="#i-ball"/></svg>
        <span class="kick-word dsp">Kick off</span>
      </span>
      <span class="kick-note eyebrow" id="kick-note">Rotate every: &#8212;</span>
    </button>
  </div>

</section>


<!-- =========================================================== game screen -->
<main id="game" hidden>

  <div class="timer" id="timer">
    <!-- the gauge. black is the shift that is left, and it draws back to the
         left edge as the shift runs out, uncovering the grey underneath. -->
    <div class="gauge" id="gauge"></div>
    <p class="eyebrow timer-label" id="timer-label">Next rotation:</p>
    <p class="count dsp" id="count">0:00</p>
    <div class="watch">
      <svg class="ic ic20" aria-hidden="true"><use href="#i-watch"/></svg>
      <span class="watch-time dsp" id="watch">0:00</span>
    </div>
    <div class="endrow">
      <span class="end-word dsp">End</span>
      <button class="end-btn" id="end" type="button" aria-label="End the game">
        <svg class="ic ic24" aria-hidden="true"><use href="#i-square"/></svg>
      </button>
    </div>
  </div>

  <section class="side" data-team="0">
    <div class="chip">
      <svg class="ic ic16" aria-hidden="true"><use href="#i-shirt"/></svg>
      <span class="chip-word eyebrow">BIBS</span>
    </div>
    <div class="side-now">
      <div class="slot">
        <p class="eyebrow slot-label"><svg class="ic ic12" aria-hidden="true"><use href="#i-glove"/></svg><span>Goal</span></p>
        <p class="keeper dsp" id="keeper-0"></p>
      </div>
      <div class="slot" id="subslot-0">
        <p class="eyebrow slot-label"><svg class="ic ic12" aria-hidden="true"><use href="#i-swap"/></svg><span id="subs-label-0">Subs</span></p>
        <div class="subnames" id="subs-0"></div>
      </div>
    </div>
    <div class="side-order" id="order-0"></div>
  </section>

  <hr class="rule">

  <section class="side" data-team="1">
    <div class="chip">
      <svg class="ic ic16" aria-hidden="true"><use href="#i-shirt-o"/></svg>
      <span class="chip-word eyebrow">NON BIBS</span>
    </div>
    <div class="side-now">
      <div class="slot">
        <p class="eyebrow slot-label"><svg class="ic ic12" aria-hidden="true"><use href="#i-glove"/></svg><span>Goal</span></p>
        <p class="keeper dsp" id="keeper-1"></p>
      </div>
      <div class="slot" id="subslot-1">
        <p class="eyebrow slot-label"><svg class="ic ic12" aria-hidden="true"><use href="#i-swap"/></svg><span id="subs-label-1">Subs</span></p>
        <div class="subnames" id="subs-1"></div>
      </div>
    </div>
    <div class="side-order" id="order-1"></div>
  </section>

</main>


<!-- ================================================================= sheet -->
<!--
  One black bar, flush to the bottom edge, no radius and no shadow — the same
  surface the Kick off bar is. It carries the two toggles a name has, and it
  carries the one question this app asks.
-->
<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <p class="eyebrow sheet-title" id="sheet-title"></p>
    <p class="sheet-opts" id="sheet-opts"></p>
  </div>
</div>

<p class="sr-only" id="faults" role="status"></p>

<script type="module" src="app.js"></script>
</body>
</html>
